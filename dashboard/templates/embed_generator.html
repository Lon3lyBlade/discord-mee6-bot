<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed-Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <nav class="bg-slate-800/80 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-sm">B</div>
            <span class="font-semibold text-lg">Bot Dashboard</span>
        </div>
        <a href="{{ url_for('dashboard') }}" class="text-sm text-slate-400 hover:text-white transition-colors">
            &larr; Zurück zur Übersicht
        </a>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-10">
        <h1 class="text-2xl font-bold mb-1">Embed-Generator</h1>
        <p class="text-slate-400 mb-8">
            Erstelle eine eingebettete Nachricht, die der Bot direkt in einen Textchannel postet.
        </p>

        {% if message %}
            <div class="mb-6 rounded-xl bg-emerald-900/40 border border-emerald-700 text-emerald-300 px-4 py-3 text-sm">
                {{ message }}
            </div>
        {% endif %}
        {% if error %}
            <div class="mb-6 rounded-xl bg-red-900/40 border border-red-700 text-red-300 px-4 py-3 text-sm">
                {{ error }}
            </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <form method="post" class="bg-slate-800 rounded-2xl p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" for="channel_id">Kanal-ID</label>
                    <input type="text" id="channel_id" name="channel_id" required
                           value="{{ form_data.channel_id }}"
                           placeholder="z.B. 123456789012345678"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" for="title">Titel</label>
                    <input type="text" id="title" name="title"
                           value="{{ form_data.title }}"
                           placeholder="Titel des Embeds"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" for="description">Beschreibung</label>
                    <textarea id="description" name="description" rows="5"
                              placeholder="Inhalt der Nachricht"
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ form_data.description }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" for="color">Farbe</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="color" name="color"
                               value="{{ form_data.color }}"
                               class="h-10 w-14 rounded-lg border border-slate-700 bg-slate-900 cursor-pointer">
                        <span id="color-value" class="text-sm text-slate-400">{{ form_data.color }}</span>
                    </div>
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-semibold py-2.5 rounded-lg">
                    Embed senden
                </button>
            </form>

            <div>
                <p class="text-sm font-medium text-slate-300 mb-2">Vorschau</p>
                <div class="bg-slate-800 rounded-2xl p-4">
                    <div id="preview-card" class="bg-slate-700/50 rounded-lg p-4 border-l-4" style="border-color: {{ form_data.color }};">
                        <p id="preview-title" class="font-semibold text-slate-100 mb-1"></p>
                        <p id="preview-description" class="text-sm text-slate-300 whitespace-pre-line"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const titleInput = document.getElementById('title');
        const descriptionInput = document.getElementById('description');
        const colorInput = document.getElementById('color');
        const colorValue = document.getElementById('color-value');
        const previewCard = document.getElementById('preview-card');
        const previewTitle = document.getElementById('preview-title');
        const previewDescription = document.getElementById('preview-description');

        function updatePreview() {
            previewTitle.textContent = titleInput.value || 'Titel des Embeds';
            previewDescription.textContent = descriptionInput.value || 'Inhalt der Nachricht';
            previewCard.style.borderColor = colorInput.value;
            colorValue.textContent = colorInput.value;
        }

        [titleInput, descriptionInput, colorInput].forEach((el) => el.addEventListener('input', updatePreview));
        updatePreview();
    </script>
</body>
</html>
