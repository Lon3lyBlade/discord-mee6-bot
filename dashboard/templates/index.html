<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0D0E12',
                        panel: '#16171C',
                        panel2: '#1D1F26',
                        line: '#272A33',
                        signal: '#F2B705',
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'ui-sans-serif', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-ink text-slate-200 font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="rounded-lg border border-line bg-panel p-10 text-center max-w-sm w-full">
        <div class="w-12 h-12 mx-auto mb-6 rounded-md bg-panel2 border border-line flex items-center justify-center font-mono text-xl text-signal">
            B
        </div>
        <h1 class="text-xl font-semibold mb-2">Bot Dashboard</h1>
        <p class="text-slate-500 mb-8">Melde dich mit Discord an, um deine Server zu verwalten.</p>
        <a href="{{ url_for('login') }}"
           class="inline-flex items-center justify-center gap-2 w-full bg-signal hover:bg-signal/90 transition-colors text-ink font-medium py-2.5 rounded">
            Mit Discord einloggen
        </a>
    </div>
</body>
</html>
