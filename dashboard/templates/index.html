<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard – Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-slate-100 min-h-screen flex items-center justify-center">
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_900px_500px_at_50%_-10%,rgba(139,92,246,0.15),transparent)]"></div>
    <div class="relative rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur-xl shadow-xl p-10 text-center max-w-sm w-full overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-white/[0.05] to-transparent pointer-events-none"></div>
        <div class="relative">
            <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-2xl font-bold">
                B
            </div>
            <h1 class="text-2xl font-bold mb-2">Bot Dashboard</h1>
            <p class="text-slate-400 mb-8">Melde dich mit Discord an, um deine Server zu verwalten.</p>
            <a href="{{ url_for('login') }}"
               class="inline-flex items-center justify-center gap-2 w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:brightness-110 transition-all text-white font-semibold py-3 rounded-xl">
                Mit Discord einloggen
            </a>
        </div>
    </div>
</body>
</html>
